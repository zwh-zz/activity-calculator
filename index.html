<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動點數計算機</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .box { background: #16213e; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .row { background: #0f172a; padding: 15px; margin: 10px 0; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        input[type="number"] { width: 120px; padding: 8px; font-size: 16px; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .score { font-size: 24px; color: #e94560; font-weight: bold; margin: 15px 0; }
        label { cursor: pointer; font-size: 16px; flex-grow: 1; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎯 活動點數全自動計算機</h2>
    
    <p>
        <label>目前擁有的現有點數：</label>
        <input type="number" id="currentPoints" value="0" oninput="calc()">
    </p>

    <div class="score">所選目標總需求：<span id="totalNeeded">0</span></div>
    <div class="score">還差多少點數：<span id="pointsDiff">0</span></div>

    <h3>請勾選你想拿的獎勵格子：</h3>
    
    <div class="row">
        <input type="checkbox" class="node" data-cost="1000" id="m1" onchange="calc()">
        <label for="m1"><span>第 1 格：大晶石</span> <span>(1000 點)</span></label>
    </div>
    
    <div class="row">
        <input type="checkbox" class="node" data-cost="1200" id="m2" onchange="calc()">
        <label for="m2"><span>第 2 格：5個羽毛</span> <span>(1200 點)</span></label>
    </div>
    
    <div class="row">
        <input type="checkbox" class="node" data-cost="1400" id="m3" onchange="calc()">
        <label for="m3"><span>第 3 格：5個羽毛</span> <span>(1400 點)</span></label>
    </div>

    <div class="row">
        <input type="checkbox" class="node" data-cost="1100" id="m4" onchange="calc()">
        <label for="m4"><span>第 4 格：寶箱</span> <span>(1100 點)</span></label>
    </div>
</div>

<script>
    function calc() {
        let total = 0;
        // 抓取所有被勾選的格子
        document.querySelectorAll('.node:checked').forEach(el => {
            total += parseInt(el.getAttribute('data-cost') || '0', 10);
        });

        let current = parseInt(document.getElementById('currentPoints').value || '0', 10);
        let diff = total - current;

        document.getElementById('totalNeeded').innerText = total;
        document.getElementById('pointsDiff').innerText = diff <= 0 ? "點數已夠！(多出 " + Math.abs(diff) + ")" : diff;
    }
</script>

</body>
</html>
