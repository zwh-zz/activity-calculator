<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動路線點數全自動計算機</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #0f3460;
            --text-color: #e2e8f0;
            --highlight: #e94560;
            --success: #4e9f3d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 13px;
            color: #aaa;
        }
        input[type="number"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            width: 160px;
        }
        .result-box {
            display: flex;
            gap: 20px;
        }
        .stat {
            background: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 120px;
            text-align: center;
        }
        .stat-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--highlight);
        }
        .stat-val.sufficient {
            color: var(--success);
        }
        .stat-lbl {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        .tabs-container {
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #888;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 6px 6px 0 0;
        }
        .tab-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: var(--highlight);
            font-weight: bold;
            border-bottom: 3px solid var(--highlight);
            background: rgba(233, 69, 96, 0.1);
        }
        .map-panel {
            display: none;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .map-panel.active {
            display: block;
        }
        .instructions {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--highlight);
        }
        .route-row {
            margin-bottom: 25px;
            background: #111827;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }
        .route-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #60a5fa;
        }
        .nodes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .node-item {
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            text-align: center;
            min-width: 85px;
        }
        .node-item:hover {
            border-color: #9ca3af;
        }
        .node-item.selected {
            background: var(--highlight);
            border-color: #ff6b81;
            color: #fff;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
        }
        .node-name {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 2px;
        }
        .node-item.selected .node-name {
            color: #ffe4e6;
        }
        .node-cost {
            font-size: 16px;
            font-weight: bold;
        }
        .arrow {
            color: #4b5563;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 活動路線點數全自動計算機</h1>
    <div class="subtitle">離線可用 • 點擊最終格子自動往回秒算總和</div>

    <div class="dashboard">
        <div class="input-group">
            <label for="currentPoints">目前擁建立的現有點數：</label>
            <input type="number" id="currentPoints" value="0" min="0" oninput="calculateTotal()">
        </div>
        <div class="result-box">
            <div class="stat">
                <div class="stat-val" id="totalNeeded">0</div>
                <div class="stat-lbl">所選目標總需求</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="pointsDiff">0</div>
                <div class="stat-lbl" id="diffLabel">還差多少點數</div>
            </div>
        </div>
    </div>

    <div class="tabs-container" id="tabsList"></div>
    <div id="panelsContainer"></div>
</div>

<script>
    // 預錄入的核心精華及最新高額大關卡數據
    const mapsData = [
        {
            id: 31,
            name: "最新關卡 (羽毛與晶石)",
            routes: [
                { title: "第 1 排（最上方：大晶石 ➔ 紅綠羽毛線）", nodes: [{lbl:"第1格 大晶石", cost:1000}, {lbl:"第2格 5個羽毛", cost:1200}, {lbl:"第3格 5個羽毛", cost:1400}] },
                { title: "第 2 排（上數第二條：寶箱 ➔ 綠色晶石線）", nodes: [{lbl:"第1格 寶箱", cost:1100}, {lbl:"第2格 5個晶石", cost:1400}, {lbl:"第3格 5個晶石", cost:1600}] },
                { title: "第 3 排（下數第二條：寶箱 ➔ 紅綠羽毛線）", nodes: [{lbl:"第1格 寶箱", cost:1300}, {lbl:"第2格 5個羽毛", cost:1700}, {lbl:"第3格 5個羽毛", cost:1900}] },
                { title: "第 4 排（最下方：寶箱 ➔ 綠色晶石線）", nodes: [{lbl:"第1格 寶箱", cost:1500}, {lbl:"第2格 5個晶石", cost:1900}, {lbl:"第3格 5個晶石", cost:2100}] }
            ]
        },
        {
            id: 30,
            name: "前一關卡 (分歧大頭像寶箱)",
            routes: [
                { title: "左上起點路線分支", nodes: [{lbl:"左上 腳印票券", cost:400}, {lbl:"核心 匯合頭像", cost:250}, {lbl:"上主支 寶箱", cost:200}, {lbl:"最上分支 盾牌", cost:150}, {lbl:"最上終點 盾牌", cost:500}] },
                { title: "左下起點路線分支", nodes: [{lbl:"左下 綠色金幣", cost:500}, {lbl:"核心 匯合頭像", cost:250}, {lbl:"下主支 閃電卡", cost:200}, {lbl:"最下分支 徽章", cost:400}, {lbl:"最下終點 徽章", cost:500}] }
            ]
        },
        {
            id: 25,
            name: "精選關卡 (最終鑰匙大匯合)",
            routes: [
                { title: "上半部：粉色櫻花鑰匙分支", nodes: [{lbl:"左上起點", cost:500}, {lbl:"上分支 櫻花匙", cost:200}, {lbl:"共通長方匙", cost:100}, {lbl:"共通長方匙2", cost:200}, {lbl:"最終綠金幣", cost:150}] },
                { title: "下半部：盾牌大獎分支", nodes: [{lbl:"左下起點1", cost:200}, {lbl:"次下起點2", cost:300}, {lbl:"共通盾牌大格", cost:500}, {lbl:"共通盾牌大格2", cost:500}, {lbl:"最終綠金幣", cost:150}] }
            ]
        },
        {
            id: 1,
            name: "第 1 關 (起點起步關卡)",
            routes: [
                { title: "走向 上方路線 (拿橘色票券)", nodes: [{lbl:"節點 1", cost:0}, {lbl:"節點 2", cost:40}, {lbl:"節點 3", cost:75}, {lbl:"節點 4", cost:90}, {lbl:"上方分支", cost:110}] },
                { title: "走向 下方路線 (拿綠色票券)", nodes: [{lbl:"節點 1", cost:0}, {lbl:"節點 2", cost:50}, {lbl:"節點 3", cost:80}, {lbl:"節點 4", cost:100}, {lbl:"下方分支", cost:120}] }
            ]
        }
    ];

    // 初始化頁面生成
    function init() {
        const tabsList = document.getElementById('tabsList');
        const panelsContainer = document.getElementById('panelsContainer');

        mapsData.forEach((map, mapIdx) => {
            // 1. 生成 Tab 按鈕
            const btn = document.createElement('button');
            btn.className = `tab-btn ${mapIdx === 0 ? 'active' : ''}`;
            btn.innerText = map.name;
            btn.onclick = () => switchTab(map.id);
            btn.setAttribute('data-tab-id', map.id);
            tabsList.appendChild(btn);

            // 2. 生成對應的關卡面板
            const panel = document.createElement('div');
            panel.id = `panel-${map.id}`;
            panel.className = `map-panel ${mapIdx === 0 ? 'active' : ''}`;

            // 加上提示文字
            panel.innerHTML = `<div class="instructions">💡 提示：直接點擊你想抵達的「最終目標」，系統會自動把前面的格子全部勾選起來！</div>`;

            // 生成每條路線
            map.routes.forEach((route, routeIdx) => {
                const routeRow = document.createElement('div');
                routeRow.className = 'route-row';

                const title = document.createElement('div');
                title.className = 'route-title';
                title.innerText = route.title;
                routeRow.appendChild(title);

                const nodesList = document.createElement('div');
                nodesList.className = 'nodes-list';

                route.nodes.forEach((node, nodeIdx) => {
                    // 如果不是第一個節點，先加個箭頭
                    if (nodeIdx > 0) {
                        const arrow = document.createElement('span');
